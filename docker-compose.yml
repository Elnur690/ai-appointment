services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: appointment_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-22432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appointment_net

  redis:
    image: redis:7-alpine
    container_name: appointment_redis
    restart: unless-stopped
    ports:
      - "22379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appointment_net

  evolution-api:
    image: atendai/evolution-api:v2.2.3
    container_name: appointment_evolution
    restart: unless-stopped
    # Internal docker network only - no public ports exposed to internet
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appointment_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: appointment_backend
    restart: unless-stopped
    ports:
      - "22800:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appointment_net

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: appointment_celery_worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appointment_net

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: appointment_celery_beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appointment_net

  admin-dashboard:
    build:
      context: ./frontend/admin-dashboard
      dockerfile: Dockerfile
    container_name: appointment_admin_dashboard
    restart: unless-stopped
    ports:
      - "22300:22300"
    env_file:
      - .env
    networks:
      - appointment_net

  business-dashboard:
    build:
      context: ./frontend/business-dashboard
      dockerfile: Dockerfile
    container_name: appointment_business_dashboard
    restart: unless-stopped
    ports:
      - "22301:22301"
    env_file:
      - .env
    networks:
      - appointment_net

volumes:
  postgres_data:
  redis_data:
  evolution_instances:

networks:
  appointment_net:
    driver: bridge
