<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06080F" />
    <title>Randevu.vip — SaaS Admin &amp; Reseller Control Panel</title>
    <style>
      .randevu-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 35%, #11192e 0%, #06080f 70%);
        color: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .randevu-splash-logo {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        box-shadow: 0 16px 48px rgba(212, 175, 55, 0.28), 0 0 0 1px rgba(212, 175, 55, 0.45);
        margin-bottom: 1.15rem;
      }
      .randevu-splash-title {
        font-size: 1.6rem;
        font-weight: 800;
        background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 50%, #aa7c11 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="randevu-splash">
        <img src="/logo.png" alt="Randevu.vip Admin" class="randevu-splash-logo" />
        <div class="randevu-splash-title">Randevu.vip Admin</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
