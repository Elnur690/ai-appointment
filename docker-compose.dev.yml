# Development overrides — launch with:
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./backend:/app
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    volumes:
      - ./backend:/app
    environment:
      - ENVIRONMENT=development
    command: celery -A app.tasks.celery_app worker --loglevel=debug --concurrency=2

  celery-beat:
    volumes:
      - ./backend:/app
    environment:
      - ENVIRONMENT=development
    command: celery -A app.tasks.celery_app beat --loglevel=debug

  admin-dashboard:
    volumes:
      - ./frontend/admin-dashboard:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev -- --host 0.0.0.0 --port 3000

  business-dashboard:
    volumes:
      - ./frontend/business-dashboard:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev -- --host 0.0.0.0 --port 3001
