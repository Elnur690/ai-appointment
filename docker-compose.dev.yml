# Development overrides — launch with:
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-22432}:5432"

  redis:
    ports:
      - "127.0.0.1:22379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./backend:/app
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
    command: uvicorn app.main:app --host 0.0.0.0 --port 22800 --reload --proxy-headers --forwarded-allow-ips="*"

  celery-worker:
    volumes:
      - ./backend:/app
    environment:
      - ENVIRONMENT=development
    command: celery -A app.tasks.celery_app worker --loglevel=debug --concurrency=2

  celery-beat:
    volumes:
      - ./backend:/app
    environment:
      - ENVIRONMENT=development
    command: celery -A app.tasks.celery_app beat --loglevel=debug

  admin-dashboard:
    build:
      context: ./frontend/admin-dashboard
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./frontend/admin-dashboard:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev -- --host 0.0.0.0 --port 22300

  business-dashboard:
    build:
      context: ./frontend/business-dashboard
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./frontend/business-dashboard:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev -- --host 0.0.0.0 --port 22301
