# ==============================================================================
# Nginx Production Configuration for randevu.vip
# Place in /etc/nginx/sites-available/randevu.vip and run:
#   sudo certbot --nginx -d randevu.vip -d www.randevu.vip -d app.randevu.vip -d admin.randevu.vip -d api.randevu.vip
# ==============================================================================

# 1. Business Owner & Salon Portal (randevu.vip / app.randevu.vip)
server {
    listen 80;
    server_name randevu.vip www.randevu.vip app.randevu.vip cname.randevu.vip;

    location / {
        proxy_pass http://127.0.0.1:22301;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. SaaS Owner & Reseller Admin Dashboard (admin.randevu.vip)
server {
    listen 80;
    server_name admin.randevu.vip;

    location / {
        proxy_pass http://127.0.0.1:22300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. FastAPI Backend REST API (api.randevu.vip)
server {
    listen 80;
    server_name api.randevu.vip;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:22800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
